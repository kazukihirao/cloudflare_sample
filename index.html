<!DOCTYPE html>

<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flattail.com</title>
    <style>
        img {
            width: min(80vw, 600px);
            max-width: 100%;
            height: auto;
        }

        #visitor-info {
            margin: 1rem 0;
        }
    </style>
</head>
<body>
<center> 
<img src="flattail_logo.jpg" alt="flattail.com logo">
<div id="visitor-info">
    <p>IP Address: <span id="visitor-ip">Loading...</span></p>
    <p>Browser Information: <span id="browser-info">Loading...</span></p>
    <p>Current Time: <span id="current-time">Loading...</span></p>
</div>
<footer>
    &copy; 2026 flattail.com. All Rights Reserved.
</footer>
</center>
<script>
    const visitorIp = document.getElementById('visitor-ip');
    const browserInfo = document.getElementById('browser-info');
    const currentTime = document.getElementById('current-time');
    const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    browserInfo.textContent = navigator.userAgent;

    const updateCurrentTime = () => {
        currentTime.textContent = `${new Date().toLocaleString('en-US', {
            dateStyle: 'medium',
            timeStyle: 'medium',
            hour12: false,
            timeZone
        })} (${timeZone})`;
    };

    updateCurrentTime();
    setInterval(updateCurrentTime, 1000);

    fetch('/cdn-cgi/trace')
        .then((response) => {
            if (!response.ok) {
                throw new Error('IP address is unavailable');
            }
            return response.text();
        })
        .then((trace) => {
            const ip = trace.match(/^ip=(.+)$/m);
            visitorIp.textContent = ip ? ip[1] : 'Unable to retrieve';
        })
        .catch(() => {
            visitorIp.textContent = 'Available only when accessed through Cloudflare';
        });
</script>
</body>
</html>
